name: Recover stuck Pages deployment
on:
  push:
    paths:
      - .github/workflows/pages-recovery.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  cancel-stale-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale Pages deployment from November 4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/54ce3e735c8c2ebe4d5f492207b7e3691df711a5/cancel"
